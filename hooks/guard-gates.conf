# guard-gates.conf: kit defaults (overwritten on reinstall).
# Put your own rules in guard-gates.local.conf; it is checked first.
#
# Format:  <allow|ask|deny> :: <bash|tool> :: <extended regex> :: <reason>
#   ask   -> shown as a permission prompt
#   deny  -> blocked outright; run it yourself with `!` if you mean it
#   allow -> stop checking (use in .local.conf to whitelist something)
# {B} = command boundary (start of line, whitespace, ; & | ` or ().
# First match wins, so put specific rules above general ones.

# --- git ---
ask :: bash :: {B}git[[:space:]]+push([[:space:]].*)?[[:space:]](-f|--force|--force-with-lease|--mirror|--delete)([[:space:]=]|$) :: Force/destructive git push. Requires explicit confirmation.
ask :: bash :: {B}git[[:space:]]+push[[:space:]].*[[:space:]]\+[^[:space:]]+ :: Force push via +refspec. Requires explicit confirmation.
ask :: bash :: {B}git[[:space:]]+push([[:space:]]|$) :: git push: committing is fine, pushing needs an explicit OK.
ask :: bash :: {B}git[[:space:]]+(commit|push)[[:space:]].*--no-verify :: --no-verify skips the hooks that exist to catch this. Fix the hook failure instead, or confirm.
ask :: bash :: {B}git[[:space:]]+reset[[:space:]].*--hard :: git reset --hard discards uncommitted work.
ask :: bash :: {B}git[[:space:]]+clean[[:space:]]+-[a-zA-Z]*f :: git clean -f deletes untracked files.

# --- terraform / opentofu ---
ask :: bash :: {B}(terraform|tofu)[[:space:]]+(apply|destroy)([[:space:]]|$) :: Terraform apply/destroy changes real infrastructure.
ask :: bash :: {B}(terraform|tofu)[[:space:]]+state[[:space:]]+(rm|mv|push)([[:space:]]|$) :: Terraform state surgery.

# --- kubernetes ---
ask :: bash :: {B}kubectl[[:space:]]+(.*[[:space:]])?(delete|apply|replace|patch|edit|scale|drain|cordon|uncordon|taint)([[:space:]]|$) :: Imperative kubectl mutation. Confirm cluster/context.
ask :: bash :: {B}kubectl[[:space:]]+(.*[[:space:]])?rollout[[:space:]]+(restart|undo)([[:space:]]|$) :: kubectl rollout restart/undo. Confirm cluster/context.
ask :: bash :: {B}helm[[:space:]]+(uninstall|delete|rollback)([[:space:]]|$) :: Helm release change. Confirm cluster.

# --- cloud CLIs ---
ask :: bash :: {B}gcloud[[:space:]].*[[:space:]](delete|deploy)([[:space:]]|$) :: Destructive or deploying gcloud command.
ask :: bash :: {B}(gsutil[[:space:]]+(-m[[:space:]]+)?rm|gcloud[[:space:]]+storage[[:space:]]+rm)([[:space:]]|$) :: Deleting cloud storage objects.
ask :: bash :: {B}aws[[:space:]].*[[:space:]](delete-[a-z-]+|terminate-instances|rb)([[:space:]]|$) :: Destructive AWS CLI command.
ask :: bash :: {B}aws[[:space:]]+s3[[:space:]]+rm([[:space:]]|$) :: Deleting S3 objects.
