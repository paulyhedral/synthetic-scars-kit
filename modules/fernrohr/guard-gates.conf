# Module: fernrohr. Gates for Fernrohr MCP tools that mutate a cluster.
# Installed as hooks/guard-gates.d/fernrohr.conf. Read-only tools
# (list_*, get_*, open_panel, load_layout, connect_context) are not gated.
ask :: tool :: ^mcp__fernrohr__delete_pods$ :: Fernrohr: deleting pods. Confirm the cluster/context first.
ask :: tool :: ^mcp__fernrohr__(restart|rollback|scale)_workload$ :: Fernrohr: workload restart/rollback/scale. Confirm the cluster/context first.
ask :: tool :: ^mcp__fernrohr__set_(configmap_value|cronjob_suspended|rollout_paused)$ :: Fernrohr: changing live cluster config. Confirm the cluster/context first.
ask :: tool :: ^mcp__fernrohr__trigger_cronjob$ :: Fernrohr: triggering a CronJob run. Confirm the cluster/context first.
