name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck install.sh hooks/*.sh modules/*/*.sh test/run-tests.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: tests (default bash)
        run: test/run-tests.sh
      - name: tests (macOS system bash 3.2)
        if: runner.os == 'macOS'
        run: BASH_BIN=/bin/bash test/run-tests.sh
